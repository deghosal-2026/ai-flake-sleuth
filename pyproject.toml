[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-flake-sleuth"
version = "0.1.0"
description = "LangGraph agent that diagnoses flaky CI tests"
authors = [
    { name = "Debashish Ghosal", email = "deghosal@users.noreply.github.com" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["flaky-tests", "ci", "github-actions", "testing", "langgraph"]
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "PyGithub>=2.4",
    "requests>=2.32",
    "rich>=13",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/deghosal-2026/ai-flake-sleuth"
Source = "https://github.com/deghosal-2026/ai-flake-sleuth"
Documentation = "https://github.com/deghosal-2026/ai-flake-sleuth/tree/main/docs"

[project.scripts]
ai-flake-sleuth = "flake_sleuth.cli:main"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "D", "UP", "ANN"]
ignore = [
    "ANN101",  # missing-type-self
    "ANN102",  # missing-type-cls
    "D100",    # missing-module-docstring
    "D104",    # missing-package-docstring
    "D200",    # one-line-docstring
    "D203",    # blank-before-class
    "D204",    # blank-after-import
    "D212",    # multi-line-docstring-summary
    "D213",    # multi-line-docstring-summary-second-line
    "D400",    # docstring-ends-in-period
    "D401",    # docstring-imperative-mood
    "D404",    # docstring-starts-with-this
    "D107",    # missing-docstring-in-init (class docstring is sufficient)
    "D415",    # docstring-ends-in-period-multiline
    "ANN401",  # dynamically-typed-expressions (needed for optional LLM adapter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101", "B311"]

[tool.coverage.run]
source = ["flake_sleuth"]

[tool.coverage.report]
fail_under = 81
